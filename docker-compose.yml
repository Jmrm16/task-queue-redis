version: "3.8"

services:
  api:
    build: .
    container_name: task_nexus_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: task_nexus_redis
    ports:
      - "6379:6379"
